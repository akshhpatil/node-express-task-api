<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow - Modern Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i data-lucide="check-square" class="logo-icon"></i>
                <span>Taskflow</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active"><i data-lucide="list-todo"></i> My Tasks</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i data-lucide="search"></i>
                    <input type="text" id="search-input" placeholder="Search tasks...">
                </div>
                <div class="header-actions">
                    <button class="btn-primary" onclick="document.getElementById('task-title').focus()">
                        <i data-lucide="plus"></i> New Task
                    </button>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="page-header">
                    <div>
                        <h1>My Tasks</h1>
                        <p class="subtitle">Organize your workflow</p>
                    </div>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                </div>

                <!-- Add Task Form inside main content -->
                <form id="task-form" class="add-task-bar">
                    <div class="input-wrapper">
                        <i data-lucide="circle" class="input-icon"></i>
                        <input type="text" id="task-title" placeholder="What needs to be done?" required minlength="3">
                        <input type="text" id="task-desc" placeholder="Details (optional)" class="desc-input">
                    </div>
                    <button type="submit" class="submit-btn"><i data-lucide="arrow-up"></i></button>
                </form>

                <div class="tasks-container" id="tasks-list">
                    <!-- Tasks will be injected here via JS -->
                    <div class="loading">Loading tasks...</div>
                </div>

                <!-- Pagination Controls -->
                <div class="pagination" id="pagination-controls" style="display: none;">
                    <button id="prev-page" class="icon-btn" disabled><i data-lucide="chevron-left"></i></button>
                    <span id="page-info">Page 1 of 1</span>
                    <button id="next-page" class="icon-btn" disabled><i data-lucide="chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>

</html>
